<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #dbeafe;
            text-align: center;
        }

        header {
            background-color: #dc2626;
            color: white;
            padding: 15px;
            border-bottom: 6px solid #7f1d1d;
        }

        header h1 {
            margin: 0 0 10px 0;
        }

        #buscador {
            width: 280px;
            padding: 10px;
            border: 3px solid #fbbf24;
            border-radius: 20px;
        }

        #mensaje {
            color: #1e3a8a;
            font-weight: bold;
        }

        #lista {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tarjeta {
            background-color: white;
            border-top: 6px solid #2563eb;
            border-radius: 10px;
            width: 170px;
            margin: 10px;
            padding: 10px;
            box-shadow: 0 3px 8px gray;
        }

        .tarjeta:hover {
            border-top-color: #dc2626;
        }

        .tarjeta img {
            width: 100px;
            height: 100px;
        }

        .tarjeta h3 {
            color: #1e3a8a;
            text-transform: capitalize;
        }

        button {
            background-color: #fbbf24;
            color: #1e3a8a;
            border: 2px solid #b45309;
            border-radius: 15px;
            padding: 7px 14px;
            font-weight: bold;
        }

        button:hover {
            background-color: #2563eb;
            color: white;
        }

        button:disabled {
            background-color: #9ca3af;
            border-color: #6b7280;
        }

        #textoPagina {
            background-color: white;
            border: 2px solid #1e3a8a;
            border-radius: 10px;
            padding: 6px 12px;
            margin: 0 10px;
        }

        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        #contenidoModal {
            background-color: white;
            width: 330px;
            max-height: 90%;
            overflow: auto;
            padding: 20px;
            border: 6px solid #dc2626;
            border-radius: 15px;
        }

        #contenidoModal h2 {
            color: #dc2626;
            text-transform: capitalize;
        }

        .tipo {
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            text-transform: capitalize;
        }
    </style>
</head>

<body>
    <header>
        <h1>POKEDEX</h1>
        <input type="text" id="buscador" placeholder="Buscar pokemon por nombre">
    </header>

    <p id="mensaje"></p>

    <div id="lista"></div>

    <br>
    <button id="anterior">Anterior</button>
    <span id="textoPagina">Pagina 1</span>
    <button id="siguiente">Siguiente</button>

    <footer>
        <p id="total"></p>
        <p id="fecha"></p>
    </footer>

    <div id="modal">
        <div id="contenidoModal"></div>
    </div>

    <script src="recursos/js/app.js"></script>
</body>

</html>
